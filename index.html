<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COAL PIT: REAL-TIME EVOLUTION</title>
    <style>
        body {
            background-color: #050508;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #ui-layer {
            width: 800px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0px 2px 4px #000;
        }
        #gameCanvas {
            border: 4px solid #222125;
            box-shadow: 0 0 35px rgba(200, 20, 20, 0.2);
            background-color: #0a090d;
        }
        #msg-box {
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0px 1px 3px #000;
            height: 24px;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div>DEPTH: <span id="ui-depth" style="color:#00ff66;">B1</span></div>
    <div>COAL IN CART: <span id="ui-coal" style="color:#fff;">0 / 3</span></div>
    <div>COBB MUTATION: <span id="ui-stage" style="color:#ffaa00;">Stage 0 (Blind)</span></div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="msg-box">COBB IS WALKING. PUSH THE CART TO THE ELEVATOR SHAFT!</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const TILE_SIZE = 40;
    const COLS = 20;
    const ROWS = 15;

    // Game Core State Variables
    let currentLevel = 1;
    let coalCollected = 0;
    let coalNeeded = 3;
    let gameOver = false;
    
    let player = { x: 2, y: 7 };
    let cart = { x: 4, y: 7 };
    let elevator = { x: 17, y: 7 };
    
    let monster = { x: 17, y: 2, stage: 0, animFrame: 0, lastMoveTime: 0, speedMs: 600 };
    let coalNodes = [];
    let grid = [];
    let animTick = 0;

    // Procedural Mine Generator (Creates straight rail lines and open coal pockets)
    function generateLevel() {
        coalCollected = 0;
        monster.stage = Math.min(3, currentLevel - 1);
        monster.speedMs = Math.max(180, 600 - (currentLevel * 90));
        
        document.getElementById("ui-depth").innerText = `B${currentLevel}`;
        document.getElementById("ui-coal").innerText = `0 / ${coalNeeded}`;
        
        // Update Stage Text
        const stages = ["Stage 0 (Blind)", "Stage 1 (Weak Hunter)", "Stage 2 (Scent Tracking)", "Stage 3 (Stalker)"];
        document.getElementById("ui-stage").innerText = stages[monster.stage];

        // Fill map with rock walls (1)
        grid = Array(ROWS).fill().map(() => Array(COLS).fill(1));

        // Carve linear horizontal tracks corridor
        for (let x = 1; x < COLS - 1; x++) grid[7][x] = 0;
        // Carve linear vertical utility lane
        for (let y = 1; y < ROWS - 1; y++) grid[y][10] = 0;

        // Carve distinct wide mining chambers (Pockets)
        const pockets = [{x:2, y:2}, {x:17, y:2}, {x:2, y:12}, {x:17, y:12}];
        pockets.forEach(p => {
            for (let dy = -1; dy  {
        if (gameOver) return;
        let dx = 0, dy = 0;

        if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") dy = -1;
        if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") dy = 1;
        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") dx = -1;
        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") dx = 1;

        if (dx !== 0 || dy !== 0) {
            let nextPx = player.x + dx;
            let nextPy = player.y + dy;

            if (grid[nextPy][nextPx] === 0) {
                // Mine Cart Pushing Physics Engine Check
                if (nextPx === cart.x && nextPy === cart.y) {
                    let nextCx = cart.x + dx;
                    let nextCy = cart.y + dy;
                    // Cart moves forward along open paths
                    if (grid[nextCy][nextCx] === 0) {
                        cart.x = nextCx;
                        cart.y = nextCy;
                        player.x = nextPx;
                        player.y = nextPy;
                    }
                } else {
                    player.x = nextPx;
                    player.y = nextPy;
                }

                // Check for coal mining hits
                coalNodes.forEach(node => {
                    if (node.active && player.x === node.x && player.y === node.y) {
                        node.active = false;
                        coalCollected++;
                        document.getElementById("ui-coal").innerText = `${coalCollected} / ${coalNeeded}`;
                    }
                });
            }
        }
    });

    // ⏱️ Independent Real-Time Monster AI Loop Execution
    function updateMonsterRealtime(timestamp) {
        if (gameOver) return;

        if (timestamp - monster.lastMoveTime > monster.speedMs) {
            monster.lastMoveTime = timestamp;

            let dx = Math.sign(player.x - monster.x);
            let dy = Math.sign(player.y - monster.y);

            if (monster.stage === 0) {
                // Stage 0: Blindly picking random card slots
                let moves = [{x:0,y:1}, {x:0,y:-1}, {x:1,y:0}, {x:-1,y:0}].filter(m => grid[monster.y + m.y][monster.x + m.x] === 0);
                if (moves.length > 0) {
                    let chosen = moves[Math.floor(Math.random() * moves.length)];
                    dx = chosen.x; dy = chosen.y;
                }
            } else if (monster.stage === 1 && Math.random() < 0.4) {
                // Stage 1: Weak tracking. 40% drift mistake rate.
                let moves = [{x:0,y:1}, {x:0,y:-1}, {x:1,y:0}, {x:-1,y:0}].filter(m => grid[monster.y + m.y][monster.x + m.x] === 0);
                if (moves.length > 0) {
                    let chosen = moves[Math.floor(Math.random() * moves.length)];
                    dx = chosen.x; dy = chosen.y;
                }
            }

            // Move block checking execution
            if (grid[monster.y + dy][monster.x + dx] === 0) {
                monster.x += dx;
                monster.y += dy;
            } else if (grid[monster.y][monster.x + dx] === 0) {
                monster.x += dx;
            } else if (grid[monster.y + dy][monster.x] === 0) {
                monster.y += dy;
            }
        }

        // Kill check
        if (player.x === monster.x && player.y === monster.y) {
            gameOver = true;
            document.getElementById("msg-box").innerText = "💀 COBB CONSUMED YOU. REFRESH PAGE TO RESTART THE ENGINES.";
        }

        // Check if level conditions are fully cleared
        if (cart.x === elevator.x && cart.y === elevator.y && coalCollected >= coalNeeded) {
            currentLevel++;
            generateLevel();
        }
    }

    // Continuous Frame Render Engine Loop
    function render(timestamp) {
        updateMonsterRealtime(timestamp);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        animTick += 0.15;
        monster.animFrame = (monster.animFrame + 0.12) % 4;

        // 1. Draw Mine Map Elements
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let x = c * TILE_SIZE;
                let y = r * TILE_SIZE;

                if (grid[r][c] === 1) {
                    ctx.fillStyle = "#27252c";
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = "#151418";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                } else {
                    ctx.fillStyle = "#121115";
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        // 2. Draw Railway Tracks Line Overlays
        for (let x = TILE_SIZE; x < canvas.width - TILE_SIZE; x += TILE_SIZE) {
            let ry = 7 * TILE_SIZE;
            ctx.strokeStyle = "#53505a";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, ry + 14); ctx.lineTo(x + TILE_SIZE, ry + 14);
            ctx.moveTo(x, ry + 26); ctx.lineTo(x + TILE_SIZE, ry + 26);
            ctx.stroke();
            // Ties
            ctx.strokeStyle = "#382e25";
            ctx.lineWidth = 3;
            for (let i = 0; i < TILE_SIZE; i += 10) {
                ctx.beginPath(); ctx.moveTo(x + i, ry + 8); ctx.lineTo(x + i, ry + 32); ctx.stroke();
            }
        }

        // 3. Draw Elevator Exit Door Frame
        let ex = elevator.x * TILE_SIZE, ey = elevator.y * TILE_SIZE;
        ctx.fillStyle = "#5c5b66";
        ctx.fillRect(ex, ey, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#8a1c1c";
        for (let i = 4; i < TILE_SIZE; i += 8) ctx.fillRect(ex + i, ey, 2, TILE_SIZE);

        // 4. Draw Active Carbon Coal Nodes
        coalNodes.forEach(node => {
            if (node.active) {
                let nx = node.x * TILE_SIZE + 20, ny = node.y * TILE_SIZE + 20;
                ctx.fillStyle = "#1c1b21";
                ctx.beginPath(); ctx.arc(nx, ny, 11, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#474952";
                ctx.beginPath(); ctx.arc(nx - 3, ny - 3, 4, 0, Math.PI * 2); ctx.fill();
            }
        });

        // 5. Draw Mine Cart Cargo Item
        let cx = cart.x * TILE_SIZE + 4, cy = cart.y * TILE_SIZE + 8;
        ctx.fillStyle = "#4b4f59";
        ctx.fillRect(cx, cy, 32, 22);
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(cx + 6, cy + 24, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 26, cy + 24, 5, 0, Math.PI * 2); ctx.fill();
        if (coalCollected > 0) {
            ctx.fillStyle = "#1c1b21";
            ctx.beginPath(); ctx.ellipse(cx + 16, cy + 2, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
        }

        // 6. Draw Animated Player Character (White Silhouette Outline Style)
        let px = player.x * TILE_SIZE + 10, py = player.y * TILE_SIZE + 4;
        let pbounce = Math.sin(animTick) * 2;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(px + 10, py + 8 + pbounce, 6, 0, Math.PI * 2); ctx.fill(); // Head
        ctx.fillRect(px + 4, py + 15, 12, 18); // Suit
        ctx.fillStyle = "#ffbb00"; // Miner Headlamp Flare Beam
        ctx.fillRect(px + 6, py + 3 + pbounce, 8, 3);

        // 7. Draw Animated Cobb Monster (Evolving Claws & Shifting Mouth Frame)
        let mx = monster.x * TILE_SIZE, my = monster.y * TILE_SIZE;
        let mshift = Math.sin(monster.animFrame) * 4;
        ctx.fillStyle = "#9c1414";
        ctx.beginPath(); ctx.ellipse(mx + 20, my + 18, 16, 18, 0, 0, Math.PI * 2); ctx.fill(); // Core Torso
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(mx + 8, my + 14 + mshift, 24, 6); // Jagged Teeth Jaw Line
        ctx.fillStyle = "#000";
        ctx.fillRect(mx + 12, my + 14 + mshift, 2, 6);
        ctx.fillRect(mx + 19, my + 14 + mshift, 2, 6);
        ctx.fillRect(mx + 26, my + 14 + mshift, 2, 6);
        // Dynamic Reach Claws
        ctx.strokeStyle = "#7a0c0c"; ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(mx + 4, my + 12); ctx.lineTo(mx - 6, my + 24 + mshift);
        ctx.moveTo(mx + 36, my + 12); ctx.lineTo(mx + 46, my + 20 - mshift);
        ctx.stroke();

        // 8. 🔦 2D Flashlight Vignette Overlay Mask
        let screenPx = player.x * TILE_SIZE + 20;
        let screenPy = player.y * TILE_SIZE + 20;
        let gradient = ctx.createRadialGradient(screenPx, screenPy, 30, screenPx, screenPy, 170);
        gradient.addColorStop(0, "rgba(0,0,0,0)");
        gradient.addColorStop(0.6, "rgba(3, 3, 6, 0.4)");
        gradient.addColorStop(1, "rgba(3, 3, 6, 0.99)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        requestAnimationFrame(render);
    }

    // Boot up Game System Layouts
    generateLevel();
    requestAnimationFrame(render);
</script>

</body>
</html>
