<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-Bit Maze Monster Game</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:monospace;
    overflow:hidden;
    text-align:center;
}

h1{
    margin:10px;
}

canvas{
    background:#111;
    display:block;
    margin:auto;
    border:4px solid white;
    image-rendering: pixelated;
}

#info{
    margin:10px;
    font-size:20px;
}
</style>
</head>

<body>

<h1>8-Bit Maze Monster</h1>
<div id="info">Keys: <span id="keyCount">0</span>/5</div>

<canvas id="game" width="960" height="640"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const TILE = 32;

const maze = [
"##############################",
"#............#...............#",
"#.######.#######.##########..#",
"#.#....#.....#...#........#..#",
"#.#.##.#####.#.###.######.#..#",
"#...##.....#.#.....#....#.#..#",
"#####.#####.#.#####.#.##.#.#.#",
"#.....#.....#.....#.#.##.#.#.#",
"#.#####.#########.#.#....#.#.#",
"#.#.....#.......#.#.######.#.#",
"#.#.#####.#####.#.#........#.#",
"#.#.....#.#...#.#.##########.#",
"#.#.###.#.#.#.#.#............#",
"#...#.#.#.#.#.#.############.#",
"#####.#.#.#.#.#............#.#",
"#.....#...#.#.############.#.#",
"#.#########.#............#.#.#",
"#...........############.#...#",
"#............................#",
"##############################"
];

const ROWS = maze.length;
const COLS = maze[0].length;

function isWall(x, y){
    return maze[y][x] === "#";
}

const player = {
    x:1,
    y:1,
    color:"#00ff00"
};

const monster = {
    x:28,
    y:18,
    color:"#ff0000"
};

const keys = [
    {x:5, y:5, found:false},
    {x:10, y:15, found:false},
    {x:18, y:2, found:false},
    {x:24, y:10, found:false},
    {x:27, y:17, found:false}
];

let collected = 0;
let gameOver = false;
let win = false;

function drawMaze(){
    for(let y=0; y<ROWS; y++){
        for(let x=0; x<COLS; x++){

            if(maze[y][x] === "#"){
                ctx.fillStyle = "#4444ff";
                ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
            }
        }
    }
}

function drawPlayer(){
    ctx.fillStyle = player.color;
    ctx.fillRect(
        player.x*TILE+4,
        player.y*TILE+4,
        TILE-8,
        TILE-8
    );
}

function drawMonster(){
    ctx.fillStyle = monster.color;

    ctx.fillRect(
        monster.x*TILE+4,
        monster.y*TILE+4,
        TILE-8,
        TILE-8
    );

    // eyes
    ctx.fillStyle = "white";

    ctx.fillRect(monster.x*TILE+8, monster.y*TILE+10, 5, 5);
    ctx.fillRect(monster.x*TILE+18, monster.y*TILE+10, 5, 5);
}

function drawKeys(){
    for(let key of keys){

        if(!key.found){

            ctx.fillStyle = "gold";

            ctx.fillRect(
                key.x*TILE+10,
                key.y*TILE+10,
                12,
                12
            );
        }
    }
}

function drawText(){

    if(gameOver){
        ctx.fillStyle = "red";
        ctx.font = "48px monospace";
        ctx.fillText("GAME OVER", 300, 300);
    }

    if(win){
        ctx.fillStyle = "lime";
        ctx.font = "48px monospace";
        ctx.fillText("YOU WIN!", 330, 300);
    }
}

function updateKeys(){

    for(let key of keys){

        if(!key.found &&
           player.x === key.x &&
           player.y === key.y){

            key.found = true;
            collected++;

            document.getElementById("keyCount").textContent = collected;

            if(collected === keys.length){
                win = true;
            }
        }
    }
}

function moveMonster(){

    if(gameOver || win) return;

    let dx = 0;
    let dy = 0;

    // basic AI chase
    if(Math.random() < 0.5){

        if(monster.x < player.x) dx = 1;
        else if(monster.x > player.x) dx = -1;

    } else {

        if(monster.y < player.y) dy = 1;
        else if(monster.y > player.y) dy = -1;
    }

    let nx = monster.x + dx;
    let ny = monster.y + dy;

    if(!isWall(nx, ny)){
        monster.x = nx;
        monster.y = ny;
    }

    if(monster.x === player.x &&
       monster.y === player.y){

        gameOver = true;
    }
}

window.addEventListener("keydown", e => {

    if(gameOver || win) return;

    let dx = 0;
    let dy = 0;

    switch(e.key.toLowerCase()){

        case "arrowup":
        case "w":
            dy = -1;
            break;

        case "arrowdown":
        case "s":
            dy = 1;
            break;

        case "arrowleft":
        case "a":
            dx = -1;
            break;

        case "arrowright":
        case "d":
            dx = 1;
            break;
    }

    let nx = player.x + dx;
    let ny = player.y + dy;

    if(!isWall(nx, ny)){
        player.x = nx;
        player.y = ny;
    }

    updateKeys();

    if(monster.x === player.x &&
       monster.y === player.y){

        gameOver = true;
    }
});

function gameLoop(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawMaze();
    drawKeys();
    drawPlayer();
    drawMonster();
    drawText();

    requestAnimationFrame(gameLoop);
}

setInterval(moveMonster, 300);

gameLoop();
</script>

</body>
</html>
