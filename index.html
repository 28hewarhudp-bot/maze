<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Garden Hose Quest</title>

<style>
body{
    margin:0;
    background:#1b1b1b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}
canvas{
    image-rendering: pixelated;
    border:4px solid #222;
    background:#4fa34f;
}
</style>
</head>
<body>

<canvas id="game" width="960" height="640"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SIZE = 32;
const W = canvas.width/SIZE;
const H = canvas.height/SIZE;

let level = 1;

let hose = [
    {x:2,y:2},
    {x:1,y:2},
    {x:0,y:2}
];

let dir = {x:1,y:0};

let growFood;
let rock;
let obstacles=[];

function rand(max){
    return Math.floor(Math.random()*max);
}

function generateLevel(){

    obstacles=[];

    for(let i=0;i<level*8;i++){
        obstacles.push({
            x:rand(W-2)+1,
            y:rand(H-2)+1
        });
    }

    growFood={
        x:rand(W-4)+2,
        y:rand(H-4)+2
    };

    rock={
        x:W-3,
        y:H-3
    };

    hose = [
        {x:2,y:2},
        {x:1,y:2},
        {x:0,y:2}
    ];
}

function same(a,b){
    return a.x===b.x && a.y===b.y;
}

function drawTile(x,y,color){
    ctx.fillStyle=color;
    ctx.fillRect(
        x*SIZE,
        y*SIZE,
        SIZE,
        SIZE
    );
}

function drawHosePart(part,index){

    if(index===0){

        // hose head
        drawTile(part.x,part.y,"#2f9cff");

        ctx.fillStyle="white";

        ctx.fillRect(
            part.x*SIZE+20,
            part.y*SIZE+8,
            5,
            5
        );

    }else{

        drawTile(
            part.x,
            part.y,
            "#35d65f"
        );
    }
}

function drawRock(){

    let x = rock.x*SIZE;
    let y = rock.y*SIZE;

    ctx.fillStyle="#777";
    ctx.beginPath();

    ctx.arc(
        x+16,
        y+16,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();

    // crack
    ctx.strokeStyle="black";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(x+16,y+6);
    ctx.lineTo(x+12,y+16);
    ctx.lineTo(x+20,y+26);
    ctx.stroke();
}

function drawGrow(){

    let x = growFood.x*SIZE;
    let y = growFood.y*SIZE;

    // hose roll
    ctx.strokeStyle="#2f9cff";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.arc(
        x+16,
        y+16,
        10,
        0,
        Math.PI*2
    );

    ctx.stroke();
}

function drawObstacle(o){

    let x=o.x*SIZE;
    let y=o.y*SIZE;

    // crate
    ctx.fillStyle="#9b5a24";

    ctx.fillRect(
        x+2,
        y+2,
        28,
        28
    );

    ctx.strokeStyle="#6d3b15";

    ctx.strokeRect(
        x+2,
        y+2,
        28,
        28
    );
}

function move(){

    let head = {
        x:hose[0].x+dir.x,
        y:hose[0].y+dir.y
    };

    if(
        head.x<0 ||
        head.y<0 ||
        head.x>=W ||
        head.y>=H
    ){
        generateLevel();
        return;
    }

    for(let o of obstacles){
        if(same(head,o)){
            generateLevel();
            return;
        }
    }

    for(let part of hose){
        if(same(head,part)){
            generateLevel();
            return;
        }
    }

    hose.unshift(head);

    if(same(head,growFood)){

        growFood={
            x:rand(W-4)+2,
            y:rand(H-4)+2
        };

    }else{

        hose.pop();
    }

    // win
    if(
        Math.abs(head.x-rock.x)<=1 &&
        Math.abs(head.y-rock.y)<=1 &&
        hose.length>=8
    ){

        level++;
        alert(
            "You filled the rock crack! Level "+level
        );

        generateLevel();
    }
}

function draw(){

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    for(let o of obstacles){
        drawObstacle(o);
    }

    drawGrow();

    drawRock();

    hose.forEach(drawHosePart);

    ctx.fillStyle="white";
    ctx.font="20px monospace";

    ctx.fillText(
        "LEVEL: "+level+
        "  HOSE: "+hose.length,
        10,
        25
    );
}

window.addEventListener(
"keydown",
e=>{

    if(e.key==="ArrowUp") dir={x:0,y:-1};
    if(e.key==="ArrowDown") dir={x:0,y:1};
    if(e.key==="ArrowLeft") dir={x:-1,y:0};
    if(e.key==="ArrowRight") dir={x:1,y:0};

});

generateLevel();

setInterval(()=>{

    move();
    draw();

},140);

</script>

</body>
</html>
